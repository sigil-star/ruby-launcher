[package]
name = "rubylauncher-tauri"
version = "1.0.13"
description = "Ruby Launcher — Tauri desktop shell"
authors = ["Ruby Launcher"]
edition = "2021"

[lib]
name = "rubylauncher_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-prevent-default = { version = "6", features = ["platform-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
dirs = "5"
chrono = { version = "0.4", default-features = true, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
parking_lot = "0.12"
url = "2"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
notify = "7"
open = "5"
discord-rich-presence = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texpresso = "2"
resvg = { version = "0.45", default-features = false }

# Same versions Tauri/wry already use: lets the in-app Roblox window set a real
# `.roblox.com` domain cookie through WebView2's cookie manager.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"



# Image decoding/encoding (client mods) is far too slow unoptimised; dependencies are compiled
# once, so this costs nothing per rebuild of Ruby itself.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
