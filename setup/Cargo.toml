[package]
name = "ruby-setup"
version = "1.0.12"
description = "Ruby Launcher Setup"
authors = ["Ruby Launcher"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
brotli-decompressor = "4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
